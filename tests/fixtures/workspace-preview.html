<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>My Space design preview</title></head>
  <body><div style="padding:8px 14px;text-align:center;font:12px/1.5 system-ui;background:#e8edf6;color:#334155;border-bottom:1px solid #cbd5e1">Design preview · Sample data · Changes are temporary</div><div id="root"></div><script type="module">
    import React from 'react';
    import {createRoot} from 'react-dom/client';
    import App from '/src/App.jsx';
    import '/src/index.css';
    import {WorkspaceContext} from '/src/hooks/workspaceContext.js';
    import {createWorkspace} from '/src/lib/workspaceLegacy.js';
    import {createWorkspaceStore} from '/src/hooks/workspaceStore.js';
    import {dateKey} from '/src/lib/tasks.js';
    import {applyTheme, DEFAULT_THEME} from '/src/lib/theme.js';
    applyTheme(DEFAULT_THEME);
    // An in-memory fixture for browser layout checks. No Firebase connection or persisted data.
    const manual = new URLSearchParams(location.search).has('manual');
    const makeSample = () => {
      const data = createWorkspace();
      const now = new Date().toISOString();
      data.notes = [{id:'preview-note', title:'Sample note', content:'A space for your ideas.', updatedAt:now}];
      data.tasks.tasks = [
        {id:'review', title:'Review system design notes', listId:'learning', repeat:'none', links:['https://bytecodebrew.com/']},
        {id:'practice', title:'Solve a practice problem', listId:'learning', repeat:'daily', links:['https://takeuforward.org/planly']},
        {id:'week', title:'Plan the week ahead', listId:'personal', repeat:'none', links:[]},
      ].map(task => ({...task, dueDate:dateKey(), completed:false, completedDates:[], flagged:false, createdAt:now}));
      return data;
    };
    function Preview() {
      const [store] = React.useState(() => createWorkspaceStore({data:manual ? null : makeSample()}));
      const [connected, setConnected] = React.useState(!manual);
      const updateData = React.useCallback((change) => {
        const data = store.getSnapshot().data;
        if (!data) return false;
        store.set({data:change(data)});
        return true;
      }, [store]);
      const value = React.useMemo(() => ({store,updateData,retry(){}}), [store,updateData]);
      return React.createElement(React.Fragment, null,
        !connected && React.createElement('button', {
          onClick: () => { store.set({data:makeSample()}); setConnected(true); },
          style:{padding:'4px 14px'}
        }, 'Connect sample workspace'),
        React.createElement(WorkspaceContext.Provider, {value}, React.createElement(App)));
    }
    createRoot(document.getElementById('root')).render(React.createElement(Preview));
  </script></body>
</html>
